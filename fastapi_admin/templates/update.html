{% extends "layout.html" %} {% block page_body %}
<div class="col-12">
  <div class="card">
    <div class="card-header">
      <h3 class="card-title">{{ resource_label }}</h3>
    </div>
    <div class="card-body border-bottom py-3">
      <form
        id="updateForm"
        method="post"
        action="{{ request.app.admin_path }}/{{ resource }}/update/{{ pk }}"
        enctype="{{ model_resource.enctype }}"
      >
        {% for input in inputs %} {{ input|safe }} {% endfor %}
        <div class="form-footer">
          <button type="submit" name="save" class="btn btn-primary">
            {{ _('save') }}
          </button>
          <button
            type="submit"
            name="save_and_return"
            class="btn btn-info mx-2"
          >
            {{ _('save_and_return') }}
          </button>
          <a
            type="button"
            class="btn btn-secondary"
            href="{{ request.app.admin_path }}/{{ resource }}/list"
            >{{ _('return') }}</a
          >
        </div>
      </form>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const form = document.getElementById('updateForm');
  
  form.addEventListener('submit', function(e) {
    e.preventDefault();
    
    // 显示加载中提示
    const saveBtn = form.querySelector('button[name="save"]');
    const originalText = saveBtn.innerHTML;
    saveBtn.innerHTML = '保存中...';
    saveBtn.disabled = true;
    
    // 获取表单数据并转换为JSON格式
    const formData = new FormData(form);
    const jsonData = {};
    
    formData.forEach((value, key) => {
      // 处理多选字段 (如select multiple)
      if (key.endsWith('[]')) {
        const baseKey = key.slice(0, -2);
        if (!jsonData[baseKey]) {
          jsonData[baseKey] = [];
        }
        jsonData[baseKey].push(value);
      } else if (jsonData[key]) {
        // 如果字段已存在且不是数组，转换为数组
        if (!Array.isArray(jsonData[key])) {
          jsonData[key] = [jsonData[key]];
        }
        jsonData[key].push(value);
      } else {
        jsonData[key] = value;
      }
    });
    
    console.log('表单数据JSON格式：', jsonData);
    
    // 使用Fetch API发送JSON数据
    fetch(form.action, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Accept': 'application/json'
      },
      body: JSON.stringify(jsonData)
    })
    .then(response => response.json())
    .then(data => {
      console.log('响应数据：', data);
      
      if (data.status === 'success') {
        // 成功处理
        const saveAndReturn = formData.has('save_and_return');
        if (saveAndReturn) {
          window.location.href = "{{ request.app.admin_path }}/{{ resource }}/list";
        } else {
          // 显示成功消息
          alert('保存成功');
          // 恢复按钮状态
          saveBtn.innerHTML = originalText;
          saveBtn.disabled = false;
        }
      } else {
        // 错误处理
        alert('保存失败: ' + (data.message || '未知错误'));
        saveBtn.innerHTML = originalText;
        saveBtn.disabled = false;
      }
    })
    .catch(error => {
      console.error('提交表单时出错：', error);
      alert('提交表单时出错: ' + error.message);
      saveBtn.innerHTML = originalText;
      saveBtn.disabled = false;
    });
  });
});
</script>
{% endblock %}
