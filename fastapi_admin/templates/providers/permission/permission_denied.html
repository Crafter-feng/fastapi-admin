{% extends 'layout.html' %}

{% block page_body %}
<div class="container-xl d-flex flex-column justify-content-center">
    <div class="empty">
        <div class="empty-img">
            <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-lock-off" width="128" height="128" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
                <path d="M15 11h2a2 2 0 0 1 2 2v2m0 4a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-6a2 2 0 0 1 2 -2h4"></path>
                <path d="M11 16a1 1 0 1 0 2 0a1 1 0 0 0 -2 0"></path>
                <path d="M8 11v-3m.347 -3.631a4 4 0 0 1 7.653 .631v6"></path>
                <path d="M3 3l18 18"></path>
            </svg>
        </div>
        <p class="empty-title">权限不足</p>
        <p class="empty-subtitle text-muted">
            您没有访问此资源的权限
        </p>
        <div class="empty-action">
            <div class="d-flex justify-content-center">
                <table class="table table-transparent w-auto">
                    <tbody>
                        <tr>
                            <td class="text-muted">资源类型</td>
                            <td>{{ resource }}</td>
                        </tr>
                        <tr>
                            <td class="text-muted">操作</td>
                            <td>{{ action }}</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <a href="{{ url_for('index') }}" class="btn btn-primary">
                <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path d="M5 12l14 0" />
                    <path d="M5 12l6 6" />
                    <path d="M5 12l6 -6" />
                </svg>
                返回首页
            </a>
        </div>
    </div>
</div>
{% endblock %}
