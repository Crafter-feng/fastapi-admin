{% extends 'layout.html' %}

{% block page_header %}
<div class="row align-items-center">
    <div class="col">
        <div class="page-pretitle">Admin Management</div>
        <h2 class="page-title">{{ title }}</h2>
    </div>
</div>
{% endblock %}

{% block page_body %}
<div class="container-xl">
    <div class="row row-cards">
        <div class="col-12">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">{{ title }}</h3>
                </div>
                <div class="card-body">
                    <form id="admin-form" data-is-edit="{% if admin %}true{% else %}false{% endif %}" data-admin-id="{{ admin.pk if admin else '' }}">
                        <div class="row mb-3">
                            <div class="col-md-6 col-12">
                                <label class="form-label required" for="username">用户名</label>
                                <input type="text" class="form-control" id="username" name="username" value="{{ admin.username if admin else '' }}" placeholder="请输入用户名" title="用户名" required>
                            </div>
                            <div class="col-md-6 col-12">
                                <label class="form-label {% if not admin %}required{% endif %}" for="password">密码</label>
                                <input type="password" class="form-control" id="password" name="password" placeholder="请输入密码" title="密码" {% if not admin %}required{% endif %}>
                                {% if admin %}
                                <small class="form-hint">如不修改密码，请留空</small>
                                {% endif %}
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6 col-12">
                                <label class="form-label" for="nickname">昵称</label>
                                <input type="text" class="form-control" id="nickname" name="nickname" value="{{ admin.nickname if admin else '' }}" placeholder="请输入昵称" title="昵称">
                            </div>
                            <div class="col-md-6 col-12">
                                <label class="form-label" for="email">邮箱</label>
                                <input type="email" class="form-control" id="email" name="email" value="{{ admin.email if admin else '' }}" placeholder="请输入邮箱" title="邮箱">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6 col-12">
                                <label class="form-label">是否激活</label>
                                <label class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" name="is_active" id="is_active" title="是否激活" {% if admin and admin.is_active %}checked{% endif %}>
                                    <span class="form-check-label">激活</span>
                                </label>
                            </div>
                            <div class="col-md-6 col-12">
                                <label class="form-label">是否超级管理员</label>
                                <label class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" name="is_superuser" id="is_superuser" title="是否超级管理员" {% if admin and admin.is_superuser %}checked{% endif %}>
                                    <span class="form-check-label">超级管理员</span>
                                </label>
                            </div>
                        </div>
                        <div class="form-footer">
                            <button type="submit" class="btn btn-primary">保存</button>
                            <a href="{{ request.app.admin_path }}/admin/list" class="btn btn-secondary ms-2">返回</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const adminForm = document.getElementById('admin-form');
        const adminPath = '{{ request.app.admin_path }}';
        
        // 提交管理员表单
        adminForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            // 获取表单数据
            const formData = new FormData(adminForm);
            const adminData = {
                username: formData.get('username'),
                nickname: formData.get('nickname') || null,
                email: formData.get('email') || null,
                is_active: formData.get('is_active') === 'on',
                is_superuser: formData.get('is_superuser') === 'on'
            };
            
            // 只有当密码不为空时才添加密码字段
            const password = formData.get('password');
            if (password) {
                adminData.password = password;
            }
            
            // 从form元素的data属性获取信息
            const isEdit = adminForm.dataset.isEdit === 'true';
            const adminId = adminForm.dataset.adminId || '';
            
            // 确定API端点
            const url = isEdit ? `${adminPath}/api/admins/${adminId}` : `${adminPath}/api/admins`;
            const method = isEdit ? "PUT" : "POST";
            
            // 提交数据
            fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(adminData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    alert('保存成功');
                    window.location.href = `${adminPath}/admin/list`;
                } else {
                    alert('保存失败: ' + (data.message || '未知错误'));
                }
            })
            .catch(error => {
                console.error('保存管理员失败:', error);
                alert('保存失败，请查看控制台');
            });
        });
    });
</script>
{% endblock %}
