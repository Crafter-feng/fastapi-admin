{% extends 'layout.html' %}

{% block page_header %}
<div class="row align-items-center">
    <div class="col">
        <div class="page-pretitle">{{ _('Role Management') }}</div>
        <h2 class="page-title">{{ _('Assign Permissions') }}</h2>
    </div>
</div>
{% endblock %}

{% block page_body %}
<div class="container-xl">
    <div class="row row-cards">
        <div class="col-12">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">{{ _('Role') }}: {{ role.label }}</h3>
                </div>
                <div class="card-body">
                    <form id="permission-form">
                        <div class="row mb-3">
                            <div class="col">
                                <div class="form-selectgroup form-selectgroup-boxes d-flex flex-column">
                                    {% for permission in permissions %}
                                    <label class="form-selectgroup-item flex-fill">
                                        <input type="checkbox" name="permissions[]" value="{{ permission.pk }}" class="form-selectgroup-input permission-checkbox"
                                        {% if permission.pk in role_permissions %}checked{% endif %}>
                                        <div class="form-selectgroup-label d-flex align-items-center p-3">
                                            <div class="me-3">
                                                <span class="form-selectgroup-check"></span>
                                            </div>
                                            <div class="form-selectgroup-label-content d-flex align-items-center">
                                                <div>
                                                    <div class="font-weight-medium">{{ permission.label }}</div>
                                                    <div class="text-muted small">{{ permission.resource }} - {{ permission.permission }}</div>
                                                </div>
                                            </div>
                                        </div>
                                    </label>
                                    {% endfor %}
                                </div>
                            </div>
                        </div>
                        <div class="form-footer">
                            <button type="submit" class="btn btn-primary">{{ _('Save') }}</button>
                            <a href="{{ request.app.admin_path }}/role/list" class="btn btn-secondary ms-2">{{ _('Back') }}</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const permissionForm = document.getElementById('permission-form');
        const adminPath = '{{ request.app.admin_path }}';
        
        permissionForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            try {
                // 获取选中的权限ID
                const selectedPermissions = Array.from(document.querySelectorAll('.permission-checkbox:checked'))
                    .map(cb => parseInt(cb.value));
                
                // 提交权限更新
                const response = await fetch(`${adminPath}/api/roles/{{ role.pk }}/permissions`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({permissions: selectedPermissions})
                });
                
                const data = await response.json();
                if (data.status !== 'success') {
                    throw new Error(data.message || '{{ _("Update permissions failed") }}');
                }
                
                alert('{{ _("Save success") }}');
                window.location.href = `${adminPath}/role/list`;
                
            } catch (error) {
                console.error('{{ _("Save failed") }}:', error);
                alert('{{ _("Save failed") }}: ' + error.message);
            }
        });
    });
</script>
{% endblock %}
