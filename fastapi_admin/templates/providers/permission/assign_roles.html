{% extends 'layout.html' %}

{% block page_header %}
<div class="row align-items-center">
    <div class="col">
        <div class="page-pretitle">{{ _('User Management') }}</div>
        <h2 class="page-title">{{ _('Assign Roles') }}</h2>
    </div>
</div>
{% endblock %}

{% block page_body %}
<div class="container-xl">
    <div class="row row-cards">
        <div class="col-12">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">{{ _('User') }}: {{ user.username }}</h3>
                </div>
                <div class="card-body">
                    <form id="role-form">
                        <div class="row mb-3">
                            <div class="col">
                                <div class="form-selectgroup form-selectgroup-boxes d-flex flex-column">
                                    {% for role in roles %}
                                    <label class="form-selectgroup-item flex-fill">
                                        <input type="checkbox" name="roles[]" value="{{ role.pk }}" class="form-selectgroup-input role-checkbox"
                                        {% if role.pk in user_roles %}checked{% endif %}>
                                        <div class="form-selectgroup-label d-flex align-items-center p-3">
                                            <div class="me-3">
                                                <span class="form-selectgroup-check"></span>
                                            </div>
                                            <div class="form-selectgroup-label-content d-flex align-items-center">
                                                <div>
                                                    <div class="font-weight-medium">{{ role.label }}</div>
                                                    <div class="text-muted small">{{ role.description or _('No description') }}</div>
                                                </div>
                                            </div>
                                        </div>
                                    </label>
                                    {% endfor %}
                                </div>
                            </div>
                        </div>
                        <div class="form-footer">
                            <button type="submit" class="btn btn-primary">{{ _('Save') }}</button>
                            <a href="{{ request.app.admin_path }}/user/list" class="btn btn-secondary ms-2">{{ _('Back') }}</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const roleForm = document.getElementById('role-form');
        const adminPath = '{{ request.app.admin_path }}';
        
        roleForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            try {
                // 获取选中的角色ID
                const selectedRoles = Array.from(document.querySelectorAll('.role-checkbox:checked'))
                    .map(cb => parseInt(cb.value));
                
                // 提交角色更新
                const response = await fetch(`${adminPath}/api/users/{{ user.pk }}/roles`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({roles: selectedRoles})
                });
                
                const data = await response.json();
                if (data.status !== 'success') {
                    throw new Error(data.message || '{{ _("Update roles failed") }}');
                }
                
                alert('{{ _("Save success") }}');
                window.location.href = `${adminPath}/user/list`;
                
            } catch (error) {
                console.error('{{ _("Save failed") }}:', error);
                alert('{{ _("Save failed") }}: ' + error.message);
            }
        });
    });
</script>
{% endblock %}
