{% extends 'layout.html' %}

{% block page_header %}
<div class="row align-items-center">
    <div class="col">
        <div class="page-pretitle">{{ _('User Management') }}</div>
        <h2 class="page-title">{{ title }}</h2>
    </div>
</div>
{% endblock %}

{% block page_body %}
<div class="container-xl">
    <div class="row row-cards">
        <div class="col-12">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">{{ title }}</h3>
                </div>
                <div class="card-body">
                    <form id="user-form" data-is-edit="{% if user %}true{% else %}false{% endif %}" data-user-id="{{ user.pk if user else '' }}">
                        <div class="row mb-3">
                            <div class="col-md-6 col-12">
                                <label class="form-label required" for="username">{{ _('username') }}</label>
                                <input type="text" class="form-control" id="username" name="username" value="{{ user.username if user else '' }}" placeholder="{{ _('Please input username') }}" title="{{ _('username') }}" required>
                            </div>
                            <div class="col-md-6 col-12">
                                <label class="form-label {% if not user %}required{% endif %}" for="password">{{ _('password') }}</label>
                                <input type="password" class="form-control" id="password" name="password" placeholder="{{ _('Please input password') }}" title="{{ _('password') }}" {% if not user %}required{% endif %}>
                                {% if user %}
                                <small class="form-hint">{{ _('Leave empty if not changing password') }}</small>
                                {% endif %}
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6 col-12">
                                <label class="form-label" for="nickname">{{ _('nickname') }}</label>
                                <input type="text" class="form-control" id="nickname" name="nickname" value="{{ user.nickname if user else '' }}" placeholder="{{ _('Please input nickname') }}" title="{{ _('nickname') }}">
                            </div>
                            <div class="col-md-6 col-12">
                                <label class="form-label" for="email">{{ _('email') }}</label>
                                <input type="email" class="form-control" id="email" name="email" value="{{ user.email if user else '' }}" placeholder="{{ _('Please input email') }}" title="{{ _('email') }}">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6 col-12">
                                <label class="form-label">{{ _('is_active') }}</label>
                                <label class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" name="is_active" id="is_active" title="{{ _('is_active') }}" {% if user and user.is_active %}checked{% endif %}>
                                    <span class="form-check-label">{{ _('Active') }}</span>
                                </label>
                            </div>
                            <div class="col-md-6 col-12">
                                <label class="form-label">{{ _('is_superuser') }}</label>
                                <label class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" name="is_superuser" id="is_superuser" title="{{ _('is_superuser') }}" {% if user and user.is_superuser %}checked{% endif %}>
                                    <span class="form-check-label">{{ _('Superuser') }}</span>
                                </label>
                            </div>
                        </div>
                        <div class="form-footer">
                            <button type="submit" class="btn btn-primary">{{ _('Save') }}</button>
                            <a href="{{ request.app.admin_path }}/user/list" class="btn btn-secondary ms-2">{{ _('Back') }}</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const userForm = document.getElementById('user-form');
        const adminPath = '{{ request.app.admin_path }}';
        
        // 提交用户表单
        userForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            // 获取表单数据
            const formData = new FormData(userForm);
            const userData = {
                username: formData.get('username'),
                nickname: formData.get('nickname') || null,
                email: formData.get('email') || null,
                is_active: formData.get('is_active') === 'on',
                is_superuser: formData.get('is_superuser') === 'on'
            };
            
            // 只有当密码不为空时才添加密码字段
            const password = formData.get('password');
            if (password) {
                userData.password = password;
            }
            
            // 从form元素的data属性获取信息
            const isEdit = userForm.dataset.isEdit === 'true';
            const userId = userForm.dataset.userId || '';
            
            // 确定API端点
            const url = isEdit ? `${adminPath}/api/users/${userId}` : `${adminPath}/api/users`;
            const method = isEdit ? "PUT" : "POST";
            
            // 提交数据
            fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(userData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    alert('{{ _("Save success") }}');
                    window.location.href = `${adminPath}/user/list`;
                } else {
                    alert('{{ _("Save failed") }}: ' + (data.message || '{{ _("Unknown error") }}'));
                }
            })
            .catch(error => {
                console.error('{{ _("Save user failed") }}:', error);
                alert('{{ _("Save failed, please check console") }}');
            });
        });
    });
</script>
{% endblock %}
