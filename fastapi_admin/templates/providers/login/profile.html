{% extends "layout.html" %}
{% block page_body %}
    {% include "components/alert_error.html" %}
    {% include "components/alert_success.html" %}
    <div class="row">
        <div class="col-12 col-md-6">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">{{ _('profile_info') }}</h3>
                </div>
                <div class="card-body">
                    <form method="post" action="{{ request.app.admin_path }}/profile/info" enctype="multipart/form-data">
                        <div class="form-group mb-3">
                            <label class="form-label">{{ _('username') }}</label>
                            <input class="form-control" type="text" name="username" value="{{ user.username }}" readonly/>
                        </div>
                        <div class="form-group mb-3">
                            <label class="form-label">{{ _('email') }}</label>
                            <input class="form-control" type="email" name="email" value="{{ user.email }}" placeholder="{{ _('email_placeholder') }}"/>
                        </div>
                        <div class="form-group mb-3">
                            <label class="form-label">{{ _('avatar') }}</label>
                            <div class="d-flex align-items-center mb-2">
                                <span class="avatar avatar-md me-3">
                                    <img src="{{ user.avatar }}" alt="{{ user.username }}"/>
                                </span>
                                <input class="form-control" type="file" name="avatar" accept="image/*"/>
                            </div>
                        </div>
                        <div class="form-group mb-3">
                            <label class="form-label">{{ _('intro') }}</label>
                            <textarea class="form-control" name="intro" rows="3" placeholder="{{ _('intro_placeholder') }}">{{ user.intro }}</textarea>
                        </div>
                        <div class="form-footer">
                            <button type="submit" class="btn btn-primary">{{ _('update_profile') }}</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-12 col-md-6">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">{{ _('update_password') }}</h3>
                </div>
                <div class="card-body">
                    <form method="post" action="{{ request.app.admin_path }}/profile/password">
                        <div class="form-group mb-3">
                            <label class="form-label">
                                {{ _('old_password') }}
                            </label>
                            <input class="form-control" type="password" name="old_password"
                                placeholder="{{ _('old_password_placeholder') }}"/>
                        </div>
                        <div class="form-group mb-3">
                            <label class="form-label">
                                {{ _('new_password') }}
                            </label>
                            <input class="form-control" type="password" name="new_password"
                                placeholder="{{ _('new_password_placeholder') }}"/>
                        </div>
                        <div class="form-group mb-3">
                            <label class="form-label">
                                {{ _('re_new_password') }}
                            </label>
                            <input class="form-control" type="password" name="re_new_password"
                                placeholder="{{ _('re_new_password_placeholder') }}"/>
                        </div>
                        <div class="form-footer">
                            <button type="submit" class="btn btn-primary">{{ _('update_password') }}</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
